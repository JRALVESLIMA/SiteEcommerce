<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio de Porções</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  
  <header class="header">
      <div class="logo-container">
        <img src="../assets/images/Logo/AvaLanchesLogo.png" alt="Logo AvaLanches" class="logo-img">
      </div>
      <button id="menu-toggle" class="menu-toggle">☰</button>
      <a href="../pages/pagamento.html" id="menu-pag" class="menu-pag">🛒</a>
    </header>

  <nav class="menu-overlay" id="menuOverlay">
    <button class="close-menu" id="closeMenu">✖</button>

    <div class="menu-logo">
      <img src="../assets/images/Logo/AvaLanchesLogo.png" alt="Logo da Lanchonete">
    </div>
    
    <ul class="menu-list">
      <li class="menu-item"><a href="../pages/index.html">☰ Início</a></li>
      <li class="menu-item"><a href="../pages/lanches.html">🍔 Lanches</a></li>
      <li class="menu-item"><a href="../pages/bebidas.html">🥤 Bebidas</a></li>
      <li class="menu-item"><a href="../pages/combos.html">🍔🥤🍟 Combos</a></li>
      <li class="menu-item"><a href="../pages/promocoes.html">🔥 Promoções</a></li>
      <li class="menu-item"><a href="../pages/pagamento.html">🛒 Carrinho</a></li>
    </ul>
  </nav>


  <div class="content">
    <section class="products">
      <h2 class="products__title">Nossos Produtos</h2>
      <div class="products__grid">

        <div class="product-card">
          <img src="../assets/images/portions/porcoes-fritas.jpg" alt="Porção Batata Frita Pequena" class="product-image" />

          <div class="product-info">
            <h3 class="product-title">Porção Batata Frita Pequenas</h3>
            <p class="product-price">R$ 29,99</p>

            <div class="product-buttons">
              <button class="btn-add-cart">Adicionar ao Carrinho</button>
              <button class="btn-buy-now">Comprar</button>
            </div>
          </div>
        </div>

        <div class="product-card">
          <img src="../assets/images/portions/porcao-calabresa.jpg" alt="Porção de Calabresa" class="product-image" />

          <div class="product-info">
            <h3 class="product-title">Porção de Calabresa</h3>
            <p class="product-price">R$ 29,99</p>

            <div class="product-buttons">
              <button class="btn-add-cart">Adicionar ao Carrinho</button>
              <button class="btn-buy-now">Comprar</button>
            </div>
          </div>
        </div>

        <div class="product-card">
          <img src="../assets/images/portions/porcao-nuggets.jpg" alt="Porção de Nuggets" class="product-image" />

          <div class="product-info">
            <h3 class="product-title">Porção de Nuggets</h3>
            <p class="product-price">R$ 29,99</p>

            <div class="product-buttons">
              <button class="btn-add-cart">Adicionar ao Carrinho</button>
              <button class="btn-buy-now">Comprar</button>
            </div>
          </div>
        </div>
          
      </div>
    </section>
  </div>

  <footer class="footer">
    <p class="footer__text">&copy; 2025 Loja de Vendas. Todos os direitos reservados.</p>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
