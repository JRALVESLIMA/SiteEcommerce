<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio de Bebidas</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  
  <header class="header">
      <div class="logo-container">
        <img src="../assets/images/Logo/AvaLanchesLogo.png" alt="Logo AvaLanches" class="logo-img">
      </div>
      <button id="menu-toggle" class="menu-toggle">☰</button>
      <a href="../pages/pagamento.html" id="menu-pag" class="menu-pag">🛒</a>
    </header>

  <nav class="menu-overlay" id="menuOverlay">
    <button class="close-menu" id="closeMenu">✖</button>
    <ul class="menu-list">
      <li class="menu-item"><a href="../pages/index.html">☰ Início</a></li>
      <li class="menu-item"><a href="../pages/lanches.html">🍔 Lanches</a></li>
      <li class="menu-item"><a href="../pages/porcoes.html">🍟 Porções</a></li>
      <li class="menu-item"><a href="../pages/combos.html">🍔🥤🍟 Combos</a></li>
      <li class="menu-item"><a href="../pages/promocoes.html">🔥 Promoções</a></li>
      <li class="menu-item"><a href="../pages/pagamento.html">🛒 Carrinho</a></li>
    </ul>
  </nav>


  <div class="content">
    <section class="products">
      <h2 class="products__title">Nossos Produtos</h2>
      <div class="products__grid">
        
        <div class="product-card">
          <img src="../assets/images/Drinks/fanta-laranja.png" alt="Fanta Laranja 350ml" class="product-image" />

          <div class="product-info">
            <h3 class="product-title">Fanta Laranja 350ml</h3>
            <p class="product-price">R$ 3,49</p>

            <div class="product-buttons">
              <button class="btn-add-cart">Adicionar ao Carrinho</button>
              <button class="btn-buy-now">Comprar</button>
            </div>
          </div>
        </div>

        <div class="product-card">
          <img src="../assets/images/Drinks/coca-lata.png" alt="Coca-Cola 350ml" class="product-image" />

          <div class="product-info">
            <h3 class="product-title">Coca-Cola 350ml</h3>
            <p class="product-price">R$ 4,69</p>

            <div class="product-buttons">
              <button class="btn-add-cart">Adicionar ao Carrinho</button>
              <button class="btn-buy-now">Comprar</button>
            </div>
          </div>
        </div>

        <div class="product-card">
          <img src="../assets/images/Drinks/coca-2l.png" alt="Coca-Cola 2L" class="product-image" />

          <div class="product-info">
            <h3 class="product-title">Coca-Cola 2L</h3>
            <p class="product-price">R$ 10,69</p>

            <div class="product-buttons">
              <button class="btn-add-cart">Adicionar ao Carrinho</button>
              <button class="btn-buy-now">Comprar</button>
            </div>
          </div>
        </div>

        <div class="product-card">
          <img src="../assets/images/Drinks/Guarana-2L.png" alt="Guaraná 2L" class="product-image" />

          <div class="product-info">
            <h3 class="product-title">Guaraná 2L</h3>
            <p class="product-price">R$ 10,69</p>

            <div class="product-buttons">
              <button class="btn-add-cart">Adicionar ao Carrinho</button>
              <button class="btn-buy-now">Comprar</button>
            </div>
          </div>
        </div>

      </div>
    </section>
  </div>
  <footer class="footer">
    <p class="footer__text">&copy; 2025 Loja de Vendas. Todos os direitos reservados.</p>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
